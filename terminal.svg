<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; font-size: 15px; }
      .p { fill: #00ff41; }
      .cmd { fill: #e6ffe9; }
      .out { fill: #58a6ff; }
      .dim { fill: #00ff41; fill-opacity: 0.55; }
      .ln { opacity: 0; animation: show 0.01s forwards; }
      @keyframes show { to { opacity: 1; } }
      .l1 { animation-delay: 0.4s; }
      .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.6s; }
      .l4 { animation-delay: 2.2s; }
      .l5 { animation-delay: 2.8s; }
      .l6 { animation-delay: 3.4s; }
      .l7 { animation-delay: 4.0s; }
      .l8 { animation-delay: 4.6s; }
      .l9 { animation-delay: 5.2s; }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .ln { opacity: 1; animation: none; }
        .cur { animation: none; }
      }
    </style>
  </defs>

  <rect width="700" height="300" rx="8" fill="#050805" stroke="#00ff41" stroke-opacity="0.6"/>
  <path d="M0 8a8 8 0 0 1 8-8h684a8 8 0 0 1 8 8v20H0z" fill="#0b120b"/>
  <line x1="0" y1="28" x2="700" y2="28" stroke="#00ff41" stroke-opacity="0.35"/>
  <circle cx="18" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="14" r="5" fill="#27c93f"/>
  <text x="350" y="19" text-anchor="middle" font-size="12" class="dim">khalil@esp-dakar: ~</text>

  <g class="ln l1"><text x="24" y="60"><tspan class="p">khalil@esp-dakar</tspan><tspan class="dim">:~$ </tspan><tspan class="cmd">whoami</tspan></text></g>
  <g class="ln l2"><text x="24" y="82" class="out">Khalil (Ibrahima Diagne)</text></g>

  <g class="ln l3"><text x="24" y="114"><tspan class="p">khalil@esp-dakar</tspan><tspan class="dim">:~$ </tspan><tspan class="cmd">cat role.txt</tspan></text></g>
  <g class="ln l4"><text x="24" y="136" class="out">pentesteur junior | #1 Sénégal sur HackerDNA</text></g>

  <g class="ln l5"><text x="24" y="168"><tspan class="p">khalil@esp-dakar</tspan><tspan class="dim">:~$ </tspan><tspan class="cmd">cat status.txt</tspan></text></g>
  <g class="ln l6"><text x="24" y="190" class="out">Licence 3 @ ESP Dakar | cherche stage en cybersécurité</text></g>

  <g class="ln l7"><text x="24" y="222"><tspan class="p">khalil@esp-dakar</tspan><tspan class="dim">:~$ </tspan><tspan class="cmd">echo $MOTTO</tspan></text></g>
  <g class="ln l8"><text x="24" y="244" class="out">hack pour apprendre</text></g>

  <g class="ln l9"><text x="24" y="276"><tspan class="p">khalil@esp-dakar</tspan><tspan class="dim">:~$ </tspan></text>
    <rect class="cur" x="204" y="263" width="9" height="16" fill="#00ff41"/>
  </g>
</svg>
